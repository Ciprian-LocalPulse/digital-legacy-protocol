name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev + web dependencies
        run: pip install -e ".[dev,web]"

      - name: Run test suite
        run: pytest tests/ -v --cov=dlp --cov-report=term-missing

      - name: Run the end-to-end demo (smoke test)
        run: python -m dlp.cli demo

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev + web dependencies
        run: pip install -e ".[dev,web]"

      - name: Ruff
        run: ruff check dlp/ tests/ examples/

      - name: Black (check only)
        run: black --check dlp/ tests/ examples/

      - name: mypy
        run: mypy dlp/ --ignore-missing-imports
        continue-on-error: true  # informative for now, not yet a hard gate

      - name: Bandit (security static analysis)
        run: bandit -r dlp/
        # unlike mypy, this IS a hard gate: every current finding has been
        # triaged and either fixed or justified with an explicit #nosec
        # comment naming why it's safe (see dlp/adapters/github.py,
        # dlp/adapters/webhook.py, dlp/notify.py) — a NEW finding here
        # means new code introduced a real issue or a new unjustified
        # urlopen call, either of which should block the build

  security-properties:
    name: Property-based security tests (Shamir, signing, hint encryption)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run property-based tests
        run: pytest tests/test_shamir_properties.py tests/test_crypto_properties.py tests/test_hint_crypto_properties.py -v
        # kept as a separate job (rather than folded into the main test
        # matrix) so a Hypothesis-found counterexample in the
        # hand-rolled cryptography is impossible to miss in the Actions
        # summary, and so this job's runtime doesn't slow down the
        # per-Python-version test matrix above

  spec-consistency:
    name: Spec file exists and is non-trivial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check spec file
        run: |
          test -f spec/SPEC.md
          lines=$(wc -l < spec/SPEC.md)
          echo "spec/SPEC.md has $lines lines"
          if [ "$lines" -lt 50 ]; then
            echo "Spec looks suspiciously short for a protocol document."
            exit 1
          fi
