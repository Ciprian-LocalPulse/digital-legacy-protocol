[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-legacy-protocol"
version = "0.7.0"
description = "An open protocol and reference implementation for verifiable digital inheritance — no single company decides whether you're gone."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Stefano (Ciprian-LocalPulse)" }
]
keywords = ["digital-legacy", "dead-mans-switch", "shamir-secret-sharing", "estate-planning", "cryptocurrency-inheritance", "ed25519"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.1",
    "ruff>=0.2",
    "mypy>=1.8",
]
web = [
    "flask>=3.0",
]

[project.scripts]
dlp = "dlp.cli:main"

[project.urls]
Homepage = "https://github.com/Ciprian-LocalPulse/digital-legacy-protocol"
Specification = "https://github.com/Ciprian-LocalPulse/digital-legacy-protocol/blob/main/spec/SPEC.md"
Issues = "https://github.com/Ciprian-LocalPulse/digital-legacy-protocol/issues"

[tool.setuptools.packages.find]
include = ["dlp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_network: test makes a real network call to an external service (best-effort, skips on failure)",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# UP006/UP035/UP045: pyupgrade rules suggesting `list`/`dict`/`X | None` over
# `List`/`Dict`/`Optional[X]`. Left as typing.* deliberately so annotations
# stay unambiguous on Python 3.9 without depending on `from __future__ import
# annotations` being present in every file that adds a type hint later.
# BLE001: flags `except Exception`. Used once, in a validation helper whose
# entire job is "did this raise for ANY reason" — narrowing it would mean
# maintaining a list of every ManifestValidationError subtype by hand.
ignore = ["UP006", "UP035", "UP045", "BLE001"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
