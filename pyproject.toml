[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-legacy-protocol"
version = "0.1.0"
description = "An open protocol and reference implementation for verifiable digital inheritance — no single company decides whether you're gone."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Stefano (Ciprian-LocalPulse)" }
]
keywords = ["digital-legacy", "dead-mans-switch", "shamir-secret-sharing", "estate-planning", "cryptocurrency-inheritance", "ed25519"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.1",
    "ruff>=0.2",
    "mypy>=1.8",
]

[project.scripts]
dlp = "dlp.cli:main"

[project.urls]
Homepage = "https://github.com/Ciprian-LocalPulse/digital-legacy-protocol"
Specification = "https://github.com/Ciprian-LocalPulse/digital-legacy-protocol/blob/main/spec/SPEC.md"
Issues = "https://github.com/Ciprian-LocalPulse/digital-legacy-protocol/issues"

[tool.setuptools.packages.find]
include = ["dlp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
